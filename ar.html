<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      :root {
        --cap-teal: #1a7179;
        --cap-orange: #eba03b;
      }

      body { margin: 0; overflow: hidden; font-family: 'Helvetica Neue', Arial, sans-serif; }

      #ui-hint {
        display: none; position: fixed; top: 25px; left: 50%; transform: translateX(-50%);
        background: rgba(20, 24, 25, 0.6); color: rgba(255, 255, 255, 0.9); padding: 8px 16px;
        border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase;
        letter-spacing: 0.5px; z-index: 9998; pointer-events: none;
        text-align: center;
      }

      #museum-card {
        display: none; position: fixed; bottom: 5vh; left: 50%; transform: translateX(-50%);
        width: 90%; max-width: 420px; background: rgba(26, 26, 24, 0.95); color: #f5f5f5;
        border-radius: 12px; border-top: 5px solid var(--cap-teal);
        box-shadow: 0 15px 40px rgba(0,0,0,0.8); z-index: 99999;
        max-height: 60vh; overflow-y: auto; pointer-events: auto;
        padding: 24px; box-sizing: border-box;
        text-align: center;
      }

      #museum-card::-webkit-scrollbar { width: 0px; }

      .badge {
        background: var(--cap-teal); color: white; padding: 4px 8px; border-radius: 4px;
        font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 15px; display: inline-block;
      }

      #dynamic-title { margin: 0 0 12px 0; }
      
      .wall-title { font-family: 'Impact', sans-serif; font-size: 34px; letter-spacing: 2px; text-transform: uppercase; margin: 0; line-height: 1; }
      
      /* Classi per le letterine colorate degli altri target */
      .t1 { color: #442a22; } .i2 { color: #5a382c; } .e3 { color: #9c4533; } .r4 { color: #872a23; } .r5 { color: #5f2821; } .a6 { color: #40241b; }

      #dynamic-text p { font-size: 14px; line-height: 1.5; margin: 0 0 12px 0; color: #d0c7bd; text-align: left; }
      #dynamic-text p strong { color: #ffffff; }

      .details-toggle {
        background: transparent; border: 1px solid var(--cap-teal); color: #ffffff;
        padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: bold;
        text-transform: uppercase; cursor: pointer; margin-top: 10px; width: 100%;
        transition: background 0.2s;
      }
      .details-toggle:active { background: var(--cap-teal); }
      
      .details-content {
        display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1);
        font-size: 13px; line-height: 1.5; color: #b5aca3; text-align: left;
      }
      .details-content.open { display: block; }
    </style>
  </head>
  <body>
    
    <div id="ui-hint">👆 Tap to lock</div>

    <div id="museum-card">
      <span class="badge" id="card-badge">Español</span>
      <div id="dynamic-title"></div>
      <div id="dynamic-text"></div>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./minds/sala1/targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" 
             color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      
      <!-- Generazione automatica dei 11 target da 0 a 10 -->
      <a-entity id="target-0" mindar-image-target="targetIndex: 0"></a-entity>
      <a-entity id="target-1" mindar-image-target="targetIndex: 1"></a-entity>
      <a-entity id="target-2" mindar-image-target="targetIndex: 2"></a-entity>
      <a-entity id="target-3" mindar-image-target="targetIndex: 3"></a-entity>
      <a-entity id="target-4" mindar-image-target="targetIndex: 4"></a-entity>
      <a-entity id="target-5" mindar-image-target="targetIndex: 5"></a-entity>
      <a-entity id="target-6" mindar-image-target="targetIndex: 6"></a-entity>
      <a-entity id="target-7" mindar-image-target="targetIndex: 7"></a-entity>
      <a-entity id="target-8" mindar-image-target="targetIndex: 8"></a-entity>
      <a-entity id="target-9" mindar-image-target="targetIndex: 9"></a-entity>
      <a-entity id="target-10" mindar-image-target="targetIndex: 10"></a-entity>
    </a-scene>

    <script>
      let isFrozen = false;
      const card = document.getElementById('museum-card');
      const hint = document.getElementById('ui-hint');
      const titleContainer = document.getElementById('dynamic-title');
      const textContainer = document.getElementById('dynamic-text');

      // Mappatura per fare in modo che più target aprano lo stesso identico contenuto (pannelli spezzati)
      const targetGroupMapping = {
        1: 1, 2: 1, 3: 1, // I pezzi 1, 2 e 3 aprono tutti la sezione MIRAR
        6: 6, 7: 6, 8: 6  // I pezzi 6, 7 e 8 aprono tutti la sezione ENTRE
      };

      const exhibitionData = {
        0: { 
          titleHTML: `<h1 class="wall-title" style="color: #ffffff; font-size: 24px;">Tierra, solamente hay una</h1>`,
          textHTML: `
            <p>A mediados del siglo pasado se extendió un modelo de producción que prometía más comodidad, bienestar y acceso al alimento para todas las personas. La agricultura a gran escala suponía producir mucho más en menos tierras.</p>
            <p>Sin embargo, este modelo venía acompañado de un uso desmedido de agroquímicos, de tala indiscriminada de bosques y selvas, saqueo de agua y contaminación de ríos, lagos y mares. Con los años, ha ido acabando con la crianza y cultivo a pequeña escala; una práctica milenaria que a mucha gente rural les asegura el sustento. La promesa de terminar con el hambre en el mundo, nunca se hizo realidad.</p>
            <button class="details-toggle" onclick="toggleDetails()">Read data</button>
            <div class="details-content">
              <strong>La realidad:</strong> La realidad es otra, es la respuesta de la naturaleza a tantos años de devastación. El calor que aprieta, las lluvias que no llegan, las sequías o inundaciones que malogran las cosechas.<br><br>
              <strong>Demanda de recursos:</strong> Se necesita medio planeta más, para cubrir el consumo actual, de una parte de la humanidad. Esta demanda de recursos supone: cortar madera antes que crezcan los bosques; extraer agua sin tiempo a la recarga de fuentes; la emisión de gases, que no alcanzan a ser absorbidos por una vegetación cada vez más escasa.<br><br>
              <strong>Datos de El Salvador:</strong> En El Salvador, se pierden 12,000 millones m² de agua de lluvia a causa de la deforestación. Se tala un promedio de 4,500 hectáreas de bosques y áreas naturales al año, respondiendo sólo a intereses comerciales.<br><br>
              <strong>Conclusión:</strong> Es hora de poner la vida en el centro.
            </div>
          `
        },
        1: { 
          titleHTML: `<h1 class="wall-title"><span class="t1">M</span><span class="i2">I</span><span class="e3">R</span><span class="r4">A</span><span class="r5">R</span></h1>`,
          textHTML: `
            <p><strong>Mirar la Tierra</strong><br> Kinkajú o martucha: esta especie de mamífero habita territorios de Cabañas y Cinquera. Es sólo uno, de tantos animales terrestres, con los que la especie humana comparte el mismo territorio.</p>
            <p><strong>Cosecha de Oxígeno</strong><br> Parque Nacional El Imposible: el oxígeno y la buena tierra depende de la vegetación, la vegetación del agua para nutrirse, y del agua dependen las criaturas que la habitan. La naturaleza convive en un círculo perfecto de dar y recibir, un círculo que la humanidad se empeña en romper.</p>
            <p><strong>Compañía en Casa</strong><br> Patos domésticos: son parte de la vida rural del territorio. Comparten casa con cerdos, gallinas, cabras, otros animales de corral y por supuesto, personas.</p>
          `
        },
        4: { 
          titleHTML: `<h1 class="wall-title"><span class="t1">T</span><span class="i2">I</span><span class="e3">E</span><span class="r4">R</span><span class="r5">R</span><span class="a6">A</span></h1>`,
          textHTML: `
            <p><strong>Tierra que alimenta:</strong> El constante crecimiento poblacional requiere una demanda cada vez más grande de recursos. La mayoría de estos recursos son acaparados por las grandes empresas.</p>
            <button class="details-toggle" onclick="toggleDetails()">Read data</button>
            <div class="details-content">
              <strong>El Pulgarcito de América:</strong> Área muy densamente poblada. El 60.20% vive en zonas urbanas y el 39.80% en zonas rurales.<br><br>
              <strong>Desglose de recursos:</strong><br>
              - <strong>Madera:</strong> para construcción y muebles.<br>
              - <strong>Industria alimentaria:</strong> alimentos para la industria y supermercados.<br>
              - <strong>Extracción de agua:</strong> agua embotellada, pozos para elaborar gaseosas, jugos, cerveza, etc.<br><br>
              <strong>Equilibrio roto:</strong> Hemos roto el equilibrio con el entorno natural, el equilibrio entre personas y su hogar territorio.
            </div>
          `
        },
        5: { 
          titleHTML: `<h1 class="wall-title"><span class="t1">P</span><span class="i2">I</span><span class="e3">E</span><span class="r4">L</span></h1>`,
          textHTML: `
            <p><strong>Piel que cubre la Tierra:</strong> la vegetación actúa como la piel del planeta, manteniendo temperaturas, regenerando aire y protegiendo los recursos hídricos. Los árboles se levantan como guardianes naturales.</p>
            <p><strong>Conexión ancestral:</strong> los pueblos originarios abrazan y nutren la Naturaleza, saben que dependen absolutamente de esta. Por otro lado, la inconsciencia colectiva del consumismo, está acabando con los recursos.</p>
            <button class="details-toggle" onclick="toggleDetails()">Read data</button>
            <div class="details-content">
              <strong>Estadísticas de deforestación:</strong> El Salvador es el segundo país más deforestado de América Latina, con un 22% de bosques talados anualmente. Sólo el 37.9% se considera área boscosa. El 8.29% lo ocupan los cafetales bajo sombra, que se cuentan dentro del total. Esto no garantiza que sean áreas protegidas. Tampoco es garantía que el resto no va a ser contaminado ni talado. No existe una protección fiable. Sólo el 1% del territorio es área protegida, frente al 10% que cada país debería tener, según El Convenio sobre Diversidad Biológica.
            </div>
          `
        },
        6: { 
          titleHTML: `<h1 class="wall-title"><span class="t1">E</span><span class="i2">N</span><span class="e3">T</span><span class="r4">R</span><span class="r5">E</span></h1>`,
          textHTML: `
            <p><strong>Raíces:</strong> Abrazadas a la tierra o surcando túneles, las raíces sostienen el entramado de los suelos y transportan el alimento. La savia que llega hasta la hoja, la flor o fruto más alto de árboles y plantas.</p>
            <p><strong>Iguanas en Cinquera:</strong> La vida pensada sólo como mercancía, es parte del desequilibrio ambiental. Ponerla en el centro supone mimarla, respetar sus tiempos, sus necesidades y transformar la relación con la naturaleza.</p>
            <p><strong>Árboles comestibles:</strong> Plantar frutales variados, es asegurar sus beneficios a lo largo del año, y por muchos años. Dan sombra, madera, son un complemento alimenticio de vitaminas, minerales y algunos: hasta de grasas, aceites y proteínas.</p>
          `
        },
        9: { 
          titleHTML: `<h1 class="wall-title"><span class="t1">C</span><span class="i2">A</span><span class="e3">Ñ</span><span class="r4">A</span><span class="r5">L</span><span class="a6">E</span><span class="t1">S</span></h1>`,
          textHTML: `
            <p><strong>LA TIERRA es como una piel.</strong> Si un cuerpo se humedece cada día con insecticida, es bastante probable, que termine enfermando. Con la tierra pasa igual. Va absorbiendo todos los tóxicos que la riegan. El veneno se acumula, hasta que un día, se vuelve infértil y muere.</p>
            <p><strong>LOS CULTIVOS extensivos de caña</strong> son ejemplo de este envenenamiento. Madurantes y otros químicos que se van a otros lugares, contaminando lo que está a su paso. El veneno se esparce y deja inservibles las tierras que toca. Las siembras familiares de subsistencia, no están libres de peligro. Estos destructores ambientales se van metiendo en la tierra, el agua, los cultivos cercanos y las personas.</p>
            <button class="details-toggle" onclick="toggleDetails()">Read data</button>
            <div class="details-content">
              <strong>Impacto en agua y salud:</strong> No sólo la caña ocasiona un mal uso de la tierra y los recursos. Los cultivos a base de regadío son un serio problema, si se toma en cuenta, la falta de disponibilidad y acceso al agua de calidad que existe en la región. Los agroquímicos se usan igualmente en todo tipo de cultivo, y muchas veces, sin la protección adecuada. Con tanto veneno, no es de extrañar la epidemia de insuficiencia renal, que golpea estos municipios. Los cultivos extensivos usan grandes cantidades de aguas subterráneas, que dejan en sequía a las comunidades.<br><br>
              <strong>La dulzura del trapiche:</strong> Los derivados del jugo de caña que ofrece un trapiche, son naturales y libres de agroquímicos. La producción es artesanal, a pequeña escala y no necesita la quema para cosechar; además promueve el consumo local. La panela endulza y mantiene los beneficios propios del jugo de caña, los cuales se pierden en el proceso del azúcar refinada.<br><br>
              <strong>Caña asiática:</strong> La caña no es originaria de América, ni era parte de la dieta de los pueblos originarios. La trajo Cristóbal Colón desde Asia. El uso de sus derivados despertó el interés comercial y comenzó su exportación a Europa. Desde entonces, los Ingenios compran a precios injustos las pequeñas producciones; acabando con otras maneras de consumo local.
            </div>
          `
        },
        10: { 
          titleHTML: `<h1 class="wall-title"><span class="t1">S</span><span class="i2">U</span><span class="e3">E</span><span class="r4">L</span><span class="r5">O</span><span class="a6">S</span></h1>`,
          textHTML: `
            <p><strong>AL MIRAR el campo</strong>, se vislumbra como la agroindustria está acabando con el territorio. Lo deteriora y no llega a solventar las necesidades alimentarias de la mayoría.</p>
            <p><strong>LO QUE LA MILPA DEJÓ:</strong> Esta práctica ancestral conecta la siembra con el territorio. Es también, una manera de relacionarse con las personas. El impacto de la Colonia modificó drásticamente esta costumbre y abrió una brecha insalvable entre producción de subsistencia y comercial. Se habla de "monocultivos" de maíz y frijol.</p>
            <button class="details-toggle" onclick="toggleDetails()">Read data</button>
            <div class="details-content">
              <strong>Modelo de agroindustria:</strong> ¿Es esta la mejor manera de alimentar un territorio? ¿A quiénes favorece este modelo? El 80% del territorio lo ocupan los sistemas de agricultura industrial, a base de monocultivos.<br><br>
              <strong>Ecuación de la agroindustria:</strong> Tala de bosques + Avance de la agroindustria + Uso suelo para pastos + Monocultivos = Deforestación, Degradación de suelos, Escasez de Alimento.<br><br>
              <strong>Desglose:</strong> 22% Pastos solos, 19% Granos básicos, 10% Café, 5% Caña, 17% Otros cultivos.<br><br>
              <strong>Iniciativas locales y naturaleza:</strong> Cultivo de caña y trapiche en San Antonio, Municipio de Suchitoto. Con esta iniciativa se mantiene una tradición que promueve la soberanía de los cultivos y ofrece productos sanos a la comunidad. Los bosques y selvas tropicales están repletos de frutos y medicinas. Llenan de sabor las mesas y complementan la alimentación.<br><br>
              <strong>Detalles de la Milpa:</strong> Milpa: frijol, maíz, chile, ayote. Se siembran plantas, granos y frutas que se van nutriendo entre ellas. Esta mezcla equilibrada asegura la cosecha, una alimentación variada y buen uso de la tierra.
            </div>
          `
        }
      };

      function toggleDetails() {
        const content = document.querySelector('.details-content');
        const btn = document.querySelector('.details-toggle');
        if (content) {
          content.classList.toggle('open');
          btn.innerText = content.classList.contains('open') ? 'Show less' : 'Read data';
        }
      }

      function handleTargetFound(targetIndex) {
        // Controlla se il target fa parte di un gruppo mappato, altrimenti usa l'indice diretto
        let dataKey = targetGroupMapping[targetIndex] !== undefined ? targetGroupMapping[targetIndex] : targetIndex;

        if (!isFrozen && exhibitionData[dataKey]) {
          titleContainer.innerHTML = exhibitionData[dataKey].titleHTML;
          textContainer.innerHTML = exhibitionData[dataKey].textHTML;
          card.style.display = 'block';
          hint.style.display = 'block';
          hint.innerText = "👆 Tap to lock";
        }
      }

      function handleTargetLost() {
        if (!isFrozen) {
          card.style.display = 'none';
          hint.style.display = 'none';
        }
      }

      // Ciclo aggiornato a 11 target (da 0 a 10)
      for (let i = 0; i <= 10; i++) {
        let targetEl = document.getElementById('target-' + i);
        if (targetEl) {
          targetEl.addEventListener('targetFound', () => handleTargetFound(i));
          targetEl.addEventListener('targetLost', handleTargetLost);
        }
      }

      document.addEventListener('click', (e) => {
        if (card.contains(e.target)) return;
        if (card.style.display === 'block') {
          isFrozen = !isFrozen;
          card.style.borderTop = isFrozen ? "5px solid var(--cap-orange)" : "5px solid var(--cap-teal)";
          hint.innerText = isFrozen ? "🔒 Locked (Tap to unlock)" : "👆 Tap to lock";
        }
      });
    </script>
  </body>
</html>
