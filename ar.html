<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      :root {
        --cap-teal: #1a7179;
        --cap-orange: #eba03b;
      }

      body { margin: 0; overflow: hidden; font-family: 'Helvetica Neue', Arial, sans-serif; }

      /* NUOVO SUGGERIMENTO: in alto, piccolo, elegante */
      #ui-hint {
        display: none; position: fixed; top: 25px; left: 50%; transform: translateX(-50%);
        background: rgba(20, 24, 25, 0.6); color: rgba(255, 255, 255, 0.9); padding: 8px 16px;
        border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase;
        letter-spacing: 0.5px; z-index: 9998; pointer-events: none;
        text-align: center;
      }

      #museum-card {
        display: none; position: fixed; bottom: 5vh; left: 50%; transform: translateX(-50%);
        width: 90%; max-width: 420px; background: rgba(26, 26, 24, 0.95); color: #f5f5f5;
        border-radius: 12px; border-top: 5px solid var(--cap-teal);
        box-shadow: 0 15px 40px rgba(0,0,0,0.8); z-index: 99999;
        max-height: 60vh; overflow-y: auto; pointer-events: auto;
        padding: 24px; box-sizing: border-box;
        text-align: center;
      }

      #museum-card::-webkit-scrollbar { width: 0px; }

      .badge {
        background: var(--cap-teal); color: white; padding: 4px 8px; border-radius: 4px;
        font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 15px; display: inline-block;
      }

      #dynamic-title { margin: 0 0 12px 0; }
      
      .wall-title { font-family: 'Impact', sans-serif; font-size: 34px; letter-spacing: 2px; text-transform: uppercase; margin: 0; line-height: 1; }
      .t1 { color: #442a22; } .i2 { color: #5a382c; } .e3 { color: #9c4533; } .r4 { color: #872a23; } .r5 { color: #5f2821; } .a6 { color: #40241b; }
      
      .f1 { color: #c22b10; } .u2 { color: #d94d1a; } .e3f { color: #e87325; } .g4 { color: #f29a35; } .o5 { color: #f7be4d; }

      #dynamic-text p { font-size: 15px; line-height: 1.6; margin: 0 0 14px 0; color: #d0c7bd; }
      #dynamic-text p strong { color: #ffffff; }
    </style>
  </head>
  <body>
    
    <!-- L'elemento esiste, ma parte invisibile -->
    <div id="ui-hint">👆 Tap to lock</div>

    <div id="museum-card">
      <span class="badge" id="card-badge">English</span>
      <div id="dynamic-title"></div>
      <div id="dynamic-text"></div>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./minds/sala1/targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" 
             color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      
      <a-entity id="target-0" mindar-image-target="targetIndex: 0"></a-entity>
      <a-entity id="target-1" mindar-image-target="targetIndex: 1"></a-entity>
    </a-scene>

    <script>
      let isFrozen = false;
      const card = document.getElementById('museum-card');
      const hint = document.getElementById('ui-hint');
      const titleContainer = document.getElementById('dynamic-title');
      const textContainer = document.getElementById('dynamic-text');

      const exhibitionData = {
        0: { 
          titleHTML: `<h1 class="wall-title"><span class="t1">T</span><span class="i2">I</span><span class="e3">E</span><span class="r4">R</span><span class="r5">R</span><span class="a6">A</span></h1>`,
          textHTML: `
            <p><strong>Overview:</strong> Extensive sugarcane crops are a prime example of this poisoning. Ripeners and other chemicals drift, contaminating everything in their path.</p>
            <p><strong>Industrial Impact:</strong> Plantations run on industrial logic, ravaging land and driving respiratory diseases through burning.</p>
            <p><strong>Health Crisis:</strong> With so much poison, it's no wonder kidney disease epidemics hit these municipalities. The degradation of soils destroys food sovereignty.</p>
           `
        },
        1: { 
          titleHTML: `<h1 class="wall-title"><span class="f1">F</span><span class="u2">U</span><span class="e3f">E</span><span class="g4">G</span><span class="o5">O</span></h1>`,
          textHTML: `
            <p><strong>Overview:</strong> Fire drives the industrial logic, ravaging land through burning.</p>
            <p>Replace this text with your actual translation for the Fire section.</p>
          `
        }
      };

      function handleTargetFound(targetIndex) {
        if (!isFrozen && exhibitionData[targetIndex]) {
          titleContainer.innerHTML = exhibitionData[targetIndex].titleHTML;
          textContainer.innerHTML = exhibitionData[targetIndex].textHTML;
          
          card.style.display = 'block';
          hint.style.display = 'block';
          hint.innerText = "👆 Tap to lock";
        }
      }

      function handleTargetLost() {
        if (!isFrozen) {
          card.style.display = 'none';
          hint.style.display = 'none';
        }
      }

      document.getElementById('target-0').addEventListener('targetFound', () => handleTargetFound(0));
      document.getElementById('target-0').addEventListener('targetLost', handleTargetLost);
      
      document.getElementById('target-1').addEventListener('targetFound', () => handleTargetFound(1));
      document.getElementById('target-1').addEventListener('targetLost', handleTargetLost);

      document.addEventListener('click', (e) => {
        if (card.contains(e.target)) return;
        if (card.style.display === 'block') {
          isFrozen = !isFrozen;
          card.style.borderTop = isFrozen ? "5px solid var(--cap-orange)" : "5px solid var(--cap-teal)";
          hint.innerText = isFrozen ? "🔒 Locked (Tap to unlock)" : "👆 Tap to lock";
        }
      });
    </script>
  </body>
</html>
