<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      :root {
        --cap-teal: #1a7179;
        --cap-orange: #eba03b;
      }

      body { margin: 0; overflow: hidden; font-family: 'Helvetica Neue', Arial, sans-serif; }

      #ui-hint {
        display: none; position: fixed; top: 25px; left: 50%; transform: translateX(-50%);
        background: rgba(20, 24, 25, 0.6); color: rgba(255, 255, 255, 0.9); padding: 8px 16px;
        border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase;
        letter-spacing: 0.5px; z-index: 9998; pointer-events: none;
        text-align: center;
      }

      #museum-card {
        display: none; position: fixed; bottom: 5vh; left: 50%; transform: translateX(-50%);
        width: 90%; max-width: 420px; background: rgba(26, 26, 24, 0.95); color: #f5f5f5;
        border-radius: 12px; border-top: 5px solid var(--cap-teal);
        box-shadow: 0 15px 40px rgba(0,0,0,0.8); z-index: 99999;
        max-height: 60vh; overflow-y: auto; pointer-events: auto;
        padding: 24px; box-sizing: border-box;
        text-align: center;
      }

      #museum-card::-webkit-scrollbar { width: 0px; }

      .badge {
        background: var(--cap-teal); color: white; padding: 4px 8px; border-radius: 4px;
        font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 15px; display: inline-block;
      }

      #dynamic-title { margin: 0 0 12px 0; }
      
      .wall-title { font-family: 'Impact', sans-serif; font-size: 34px; letter-spacing: 2px; text-transform: uppercase; margin: 0; line-height: 1; }
      
      /* Classi per le letterine colorate degli altri target */
      .t1 { color: #442a22; } .i2 { color: #5a382c; } .e3 { color: #9c4533; } .r4 { color: #872a23; } .r5 { color: #5f2821; } .a6 { color: #40241b; }

      #dynamic-text p { font-size: 14px; line-height: 1.5; margin: 0 0 12px 0; color: #d0c7bd; text-align: left; }
      #dynamic-text p strong { color: #ffffff; }

      .details-toggle {
        background: transparent; border: 1px solid var(--cap-teal); color: #ffffff;
        padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: bold;
        text-transform: uppercase; cursor: pointer; margin-top: 10px; width: 100%;
        transition: background 0.2s;
      }
      .details-toggle:active { background: var(--cap-teal); }
      
      .details-content {
        display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1);
        font-size: 13px; line-height: 1.5; color: #b5aca3; text-align: left;
      }
      .details-content.open { display: block; }
    </style>
  </head>
  <body>
    
    <div id="ui-hint">👆 Tap to lock</div>

    <div id="museum-card">
      <span class="badge" id="card-badge">English</span>
      <div id="dynamic-title"></div>
      <div id="dynamic-text"></div>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./minds/targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" 
             color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      
      <!-- Tutti gli 11 target da 0 a 11 -->
      <a-entity id="target-0" mindar-image-target="targetIndex: 0"></a-entity>
      <a-entity id="target-1" mindar-image-target="targetIndex: 1"></a-entity>
      <a-entity id="target-2" mindar-image-target="targetIndex: 2"></a-entity>
      <a-entity id="target-3" mindar-image-target="targetIndex: 3"></a-entity>
      <a-entity id="target-4" mindar-image-target="targetIndex: 4"></a-entity>
      <a-entity id="target-5" mindar-image-target="targetIndex: 5"></a-entity>
      <a-entity id="target-6" mindar-image-target="targetIndex: 6"></a-entity>
      <a-entity id="target-7" mindar-image-target="targetIndex: 7"></a-entity>
      <a-entity id="target-8" mindar-image-target="targetIndex: 8"></a-entity>
      <a-entity id="target-9" mindar-image-target="targetIndex: 9"></a-entity>
      <a-entity id="target-10" mindar-image-target="targetIndex: 10"></a-entity>
      <a-entity id="target-11" mindar-image-target="targetIndex: 11"></a-entity>
    </a-scene>

    <script>
      let isFrozen = false;
      const card = document.getElementById('museum-card');
      const hint = document.getElementById('ui-hint');
      const titleContainer = document.getElementById('dynamic-title');
      const textContainer = document.getElementById('dynamic-text');

      // Mappatura dei target spezzati orizzontalmente (1, 2, 3 puntano a 1; 6, 7, 8 puntano a 6)
      const targetGroupMapping = {
        1: 1, 2: 1, 3: 1,
        6: 6, 7: 6, 8: 6
      };

      const exhibitionData = {
        0: { 
          titleHTML: `<h1 class="wall-title" style="color: #ffffff; font-size: 24px;">Earth, there is only one</h1>`,
          textHTML: `
            <p>In the middle of the last century, a production model spread that promised more comfort, well-being, and access to food for all people. Large-scale agriculture meant producing much more in less land.</p>
            <p>However, this model was accompanied by an immoderate use of agrochemicals, indiscriminate logging of forests and jungles, water plundering, and contamination of rivers, lakes, and seas. Over the years, it has been ending small-scale raising and cultivation; a millenary practice that ensures livelihood for many rural people. The promise of ending world hunger never became a reality.</p>
            <button class="details-toggle" onclick="toggleDetails()">Read data</button>
            <div class="details-content">
              The reality is other, it is nature's response to so many years of devastation. The heat that presses, the rains that do not arrive, the droughts or floods that ruin crops.<br><br>
              Half a planet more is needed to cover current consumption, by a part of humanity. This demand for resources means: cutting wood before forests grow; extracting water without time for the recharge of sources; the emission of gases, which cannot be absorbed by an increasingly scarce vegetation.<br><br>
              In El Salvador, 12,000 million m² of rainwater are lost due to deforestation. An average of 4,500 hectares of forests and natural areas are logged per year, responding only to commercial interests.<br><br>
              <strong>It is time to put life at the center.</strong>
            </div>
          `
        },
        1: { 
          titleHTML: `<h1 class="wall-title"><span class="t1">M</span><span class="i2">I</span><span class="e3">R</span><span class="r4">A</span><span class="r5">R</span></h1>`,
          textHTML: `
            <p><strong>Mirar la Tierra</strong><br> Kinkajú or martucha: this mammal species inhabits the territories of Cabañas and Cinquera. It is just one of many terrestrial animals with which the human species shares the same territory.</p>
            <p><strong>Cosecha de Oxígeno</strong><br> El Imposible National Park: oxygen and good soil depend on vegetation, vegetation depends on water to nourish itself, and the creatures that inhabit it depend on water. Nature coexists in a perfect circle of giving and receiving, a circle that humanity is determined to break.</p>
            <p><strong>Compañía en Casa</strong><br> Domestic ducks: they are part of the rural life of the territory. They share a home with pigs, chickens, goats, other farm animals, and of course, people.</p>
          `
        },
        4: { 
          titleHTML: `<h1 class="wall-title"><span class="t1">T</span><span class="i2">I</span><span class="e3">E</span><span class="r4">R</span><span class="r5">R</span><span class="a6">A</span></h1>`,
          textHTML: `
            <p><strong>LONG AGO</strong>, before this territory was a country called El Salvador, it was inhabited by other populations. The native peoples name the place where they live as "Our Mother Earth", in Nahuat <i>Tunan Tal</i>. <i>Tunan Tal</i> is the place where life is created, the place that feeds and provides water to drink. It is the place that guards the goods that allow the continuity of existence throughout the length, breadth, and roundness of the Earth.</p>
            <p><strong>The native peoples embrace and nurture Nature, knowing they depend absolutely on it. On the other hand, the collective unconsciousness of consumerism is depleting our resources.</strong></p>
            <p><strong>Tierra que alimenta:</strong> constant population growth requires an increasingly large demand for resources. Most of these resources are heavily hoarded by large corporations.</p>
            <button class="details-toggle" onclick="toggleDetails()">Read data</button>
            <div class="details-content">
              <strong>Territorial data<br></strong> Inhabitants: 6,581,860.<br> Territorial extension: 21,041 km².<br><br>
              <strong>El Salvador, called "El Pulgarcito de América"</strong> is a highly densely populated area. 60.20% of the population lives in urban zones and 39.80% in rural area.<br><br>
              <strong>Resource breakdown:</strong><br>
              - <strong>Wood:</strong> used for construction and furniture.<br>
              - <strong>Food Industry:</strong> providing supplies for supermarkets.<br>
              - <strong>Water Extraction:</strong> bottled water and wells for sodas, juices, and beer.<br><br>
              <strong>Broken Balance:</strong> we have broken the balance with the natural environment.
            </div>
          `
        },
        5: { 
          titleHTML: `<h1 class="wall-title"><span class="t1">P</span><span class="i2">I</span><span class="e3">E</span><span class="r4">L</span></h1>`,
          textHTML: `
            <p><strong>Piel que cubre la Tierra</strong><br><strong>VEGETATION</strong> is to the planet what skin is to our bodies. This green layer is what maintains the appropriate temperature, regenerates the air, protects water, and nourishes.</p>
            <p>Foliage feeds on light. Foliage is food and shelter for other living beings. Roots protect and filter water. They support and nourish the soils.</p>
            <p><strong>GREENERY eats carbon from the air</strong>, transforms it into food, leaves, and trunks; in return, it produces oxygen and refreshes the environment.</p>
            <p><strong>IT SEEMS that now</strong>, the Earth is only seen as a "chest full of resources", from which to take and take without limit. The bad news is that what comes out of this "chest" runs out, and if it runs out, life is not possible. Rethinking consumption habits is a necessary step to take.</p>
            <button class="details-toggle" onclick="toggleDetails()">Read data</button>
            <div class="details-content">
              <strong>Ancestral connection:</strong> in many communities, through ecological crops, they are betting on the rescue of ancestral practices.<br><br>
              <strong>Deforestation Stats:</strong> El Salvador does not have much nature to be proud of. It is the second most deforested country in Latin America.<br><br> 1) 22% of forests are cut down annually.<br><br>2) Only 37.9% is considered wooded area (this equals 7,995 km²).<br><br>3) The 8.29% is occupied by shade-grown coffee plantations, which are counted within the total. This does not guarantee that they are protected areas. Nor is it a guarantee that the rest will not be contaminated or logged. Reliable protection does not exist.<br><br>4) Only 1% of the territory is a protected area, compared to the 10% that every country should have, according to the Convention on Biological Diversity.
            </div>
          `
        },
        6: { 
          titleHTML: `<h1 class="wall-title"><span class="t1">T</span><span class="i2">I</span><span class="e3">E</span><span class="r4">R</span><span class="r5">R</span><span class="a6">A</span></h1>`,
          textHTML: `
            <p><strong>Entre el cielo y el suelo</strong><br>Raíces: embraced by the earth or cutting through tunnels, roots support the network of soils and transport nourishment. The sap that reaches the highest leaf, flower, or fruit of trees and plants.</p>
            <p><strong>La vide en el centro</strong><br>Iguanas in Cinquera: life thought of solely as a commodity is part of the environmental imbalance. Placing it at the center means pampering it, respecting its times, its needs, and transforming the relationship with nature.</p>
            <p><strong>Árboles comestibles</strong><br>Succulent branches: planting varied fruit trees ensures their benefits throughout the year and for many years. They provide shade, wood, and are a dietary complement of vitamins, minerals, and sometimes even fats, oils, and proteins.</p>
          `
        },
        9: { 
          titleHTML: `<h1 class="wall-title"><span class="t1">C</span><span class="i2">A</span><span class="e3">Ñ</span><span class="r4">A</span><span class="r5">L</span><span class="a6">E</span><span class="t1">S</span></h1>`,
          textHTML: `
            <p><strong>No tan dulces los cañales</strong><br><strong>THE EARTH is like skin.</strong> If a body is moistened every day with insecticide, it is quite likely that it will end up getting sick. The same happens with the earth. It absorbs all the toxins used to irrigate it. The poison accumulates until one day, it becomes infertile and dies.</p>
            <p><strong>Amargos Efectos</strong><br><strong>EXTENSIVE SUGARCANE CROPS</strong> are an example of this poisoning. Ripening agents and other chemicals travel to other places, contaminating what is in their path. The poison spreads and renders the lands it touches useless. Family subsistence crops are not free from danger.</p>
            <button class="details-toggle" onclick="toggleDetails()">Read data</button>
            <div class="details-content">
              <strong> Sugarcane plantations with industrial logic:</strong> it ravages land, drags respiratory diseases due to burning and the use of agrochemicals. Soil wear and massive deforestation impact and produce a loss in the food sovereignty of peoples.<br><br>
              <strong>Water & Health Impact:</strong> not only sugarcane causes misuse of land and resources. Irrigated crops are a serious problem, considering the lack of availability and access to quality water in the region. Agrochemicals are used equally in all types of crops, and often without proper protection. With so much poison, it is no wonder the epidemic of kidney failure hitting these municipalities. Extensive crops use large amounts of groundwater, leaving communities in drought.<br><br>
              <strong>The Trapiche:</strong> <strong>THE DERIVATIVES of sugarcane juice</strong> offered by a traditional sugar mill (*trapiche*) are natural and free of agrochemicals. Production is artisanal, small-scale, and does not require burning to harvest; furthermore, it promotes local consumption. <br><br>
              <strong>Asian Sugarcane:</strong> <strong>SUGARCANE is not native</strong> to America, nor was it part of the diet of native peoples. Christopher Columbus brought it from Asia. The use of its derivatives awakened commercial interest and its exportation to Europe began. Since then, sugar mills buy small productions at unfair prices, destroying other ways of local consumption.
            </div>
          `
        },
        10: { 
          titleHTML: `<h1 class="wall-title"><span class="t1">S</span><span class="i2">U</span><span class="e3">E</span><span class="r4">L</span><span class="r5">O</span><span class="a6">S</span></h1>`,
          textHTML: `
            <p><strong>Suelos para comer</strong><br><strong>LOOKING at the countryside</strong>, one glimpses how agroindustry is destroying the territory.</p>
            <p><strong>WHAT THE MILPA LEFT BEHIND:</strong> this ancestral practice connects planting with the territory. It is also a way of relating to people. The impact of the Colony drastically modified this custom and opened an unbridgeable gap between subsistence and commercial production. People speak of corn and bean "monocultures".</p>
            <button class="details-toggle" onclick="toggleDetails()">Read data</button>
            <div class="details-content">
              <strong>Agroindustry Model:</strong> is this the best way to feed a territory? Who does this model favor? 80% of the territory is occupied by industrial agriculture systems based on monocultures.<br>
              <strong>Land use distribution:</strong> 22% Sole pastures, 19% Basic grains, 10% Coffee, 5% Caña Sugarcane, 17% Other crops.<br><br>
              <strong>Agroindustry Equation:</strong><br> Deforestation +<br>Advance of agroindustry +<br>Land use for pasture +<br>Monocultures<br>= Deforestation, Soil degradation, Food scarcity.<br><br>
              <strong>Local Initiatives & Nature:</strong> sugarcane cultivation and traditional sugar mill in San Antonio, Municipality of Suchitoto. This initiative maintains a tradition that promotes crop sovereignty and offers healthy products to the community. Tropical forests and jungles are full of fruits and medicines. They fill tables with flavor and complement nutrition.<br><br>
              <strong>Milpa:</strong> bean, corn, chili, squash. Plants, grains, and fruits are sown and nourish each other. This balanced mixture ensures the harvest, a varied diet, and good use of the land.
            </div>
          `
        },
        11: { 
        titleHTML: `<h1 class="wall-title"><span class="t1">L</span><span class="i2">I</span><span class="e3">V</span><span class="r4">E</span><span class="r5">S</span><span class="a6">T</span><span class="t1">O</span><span class="i2">C</span><span class="e3">K</span></h1>`,
        textHTML: `
            <p><strong>Sube la temperatura del invernadero</strong><br>In the <strong>ATMOSPHERE</strong> different natural gases coexist, which in adequate proportions are necessary to maintain a good temperature on the Planet.</p>
            <p>Certain human activities emit and make the concentration of these gases increase. This excess unbalances the natural greenhouse effect and is what produces global warming.</p>
            <p>The gases do not let excess heat escaping that enters the atmosphere, the heat accumulates and the earth heats up.</p>
            <p><strong>Ganado, granjas y deterioro ambiental:</strong> large-scale <strong>LIVESTOCK</strong> has been the cause of the deforestation of a considerable amount of forests. It requires large tracts of land with forage and no trees for grazing. The most visible impact is soil degradation and water contamination in livestock production environments.</p>
            <button class="details-toggle" onclick="toggleDetails()">Read data</button>
            <div class="details-content">
              <strong>Greenhouse gas emissions:</strong> 18% of greenhouse gas emissions (CO2) are produced by LIVESTOCK.<br><br>
              <strong>Agricultural land use:</strong><br>
              - 26% Pasture for livestock.<br>
              - 33% Cultivation of grain for concentrated feed.<br>
              - 41% Cultivation of food for human consumption.<br><br>
              <strong>What makes heat rise?</strong><br>
              - 9% Deforestation for pastures.<br>
              - 37% Methane emissions produced by ruminant digestion.<br>
              - 65% Nitrous oxide emissions produced by manure. The earth is only capable of absorbing 9% of the excrement from livestock. The rest ends up in the air, the earth, and sources of drinking water.<br><br>
              <strong>Livestock arrived by sea:</strong> LIVESTOCK at the beginning of the Colony brought hitherto unknown animals: cows, oxen, donkeys, horses, pigs, chickens, and geese. Society has always seen being a cattle rancher as prestigious. A work linked to economic power, which makes it difficult to demand responsible practices with the environment.<br><br>
              <strong>Acid Rain:</strong> AIR fills with noxious gases that mix with atmospheric moisture. This combination makes rain become acidic. This acidity affects the life of seas and lakes, changes the composition of soils and kills vegetation.<br><br>
              <strong>Pasture Lands:</strong> lands destined for pastures have come to occupy almost a quarter of the territory. An inefficient African grass species has been sown that degrades soils.
            </div>
          `
        }
      };

      function toggleDetails() {
        const content = document.querySelector('.details-content');
        const btn = document.querySelector('.details-toggle');
        if (content) {
          content.classList.toggle('open');
          btn.innerText = content.classList.contains('open') ? 'Show less' : 'Read data';
        }
      }

      function handleTargetFound(targetIndex) {
        let dataKey = targetGroupMapping[targetIndex] !== undefined ? targetGroupMapping[targetIndex] : targetIndex;

        if (!isFrozen && exhibitionData[dataKey]) {
          titleContainer.innerHTML = exhibitionData[dataKey].titleHTML;
          textContainer.innerHTML = exhibitionData[dataKey].textHTML;
          card.style.display = 'block';
          hint.style.display = 'block';
          hint.innerText = "👆 Tap to lock";
        }
      }

      function handleTargetLost() {
        if (!isFrozen) {
          card.style.display = 'none';
          hint.style.display = 'none';
        }
      }

      // Ciclo aggiornato a 12 target (da 0 a 11)
      for (let i = 0; i <= 11; i++) {
        let targetEl = document.getElementById('target-' + i);
        if (targetEl) {
          targetEl.addEventListener('targetFound', () => handleTargetFound(i));
          targetEl.addEventListener('targetLost', handleTargetLost);
        }
      }

      document.addEventListener('click', (e) => {
        if (card.contains(e.target)) return;
        if (card.style.display === 'block') {
          isFrozen = !isFrozen;
          card.style.borderTop = isFrozen ? "5px solid var(--cap-orange)" : "5px solid var(--cap-teal)";
          hint.innerText = isFrozen ? "🔒 Locked (Tap to unlock)" : "👆 Tap to lock";
        }
      });
    </script>
  </body>
</html>
