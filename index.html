<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome | Centro Arte para la Paz</title>
  <style>
    :root {
      --cap-teal: #1a7179;
    }

    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      font-family: 'Helvetica Neue', Arial, sans-serif; 
      background-color: #f2efe9;
      color: #333;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
      box-sizing: border-box;
    }

    .content-box {
      max-width: 90%;
      width: 400px;
      text-align: center;
      max-height: 85vh;
      overflow-y: auto;
      padding-bottom: 20px;
    }

    .content-box::-webkit-scrollbar { width: 0px; }

    .logo-img {
      width: 100%;
      max-width: 180px;
      margin-bottom: 20px;
    }
    
    /* Nuovo titolo generale per la stanza */
    .room-title {
      font-family: 'Arial Black', sans-serif;
      font-size: 24px;
      color: #442a22;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 5px 0;
    }

    .room-subtitle {
      font-family: 'Arial', sans-serif;
      font-size: 14px;
      color: var(--cap-teal);
      margin-bottom: 30px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .instruction {
      display: flex;
      align-items: flex-start;
      text-align: left;
      margin-bottom: 15px;
      font-size: 14px;
      line-height: 1.5;
      color: #555;
      background: #ffffff;
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
      border-left: 4px solid var(--cap-teal);
    }

    .instruction strong {
      color: #222;
      font-size: 15px;
      display: block;
      margin-bottom: 4px;
    }

    .icon { 
      font-size: 24px; 
      margin-right: 15px; 
      line-height: 1.2;
    }

    .btn {
      display: block;
      margin-top: 15px;
      padding: 16px 32px;
      background: var(--cap-teal);
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(26, 113, 121, 0.4);
    }

    .btn:active { 
      transform: translateY(2px); 
      box-shadow: 0 2px 5px rgba(26, 113, 121, 0.4);
    }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="content-box">
      <!-- Logo istituzionale -->
      <img src="logo.png" alt="Centro Arte para la Paz Logo" class="logo-img">
      
      <!-- Intestazione generale, senza riferimenti a un solo elemento -->
      <h1 class="room-title">Museo Suchitoto</h1>
      <div class="room-subtitle">Interactive English Guide</div>
      
      <div class="instruction">
        <span class="icon">📸</span>
        <div>
          <strong>Scan the panels</strong>
          Point your camera at the exhibition panels to reveal real-time English translations.
        </div>
      </div>

      <div class="instruction">
        <span class="icon">👆</span>
        <div>
          <strong>Tap to freeze</strong>
          Tap the screen at any time to lock the caption in place. You can scroll the text to read it comfortably.
        </div>
      </div>

      <a href="ar.html" class="btn">Start Experience</a>
    </div>
  </div>
</body>
</html>
