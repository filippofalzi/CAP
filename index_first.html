<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <link rel="manifest" href="manifest.json">
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: ./minds/sala1/targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Sfondo semitrasparente della didascalia -->
        <a-plane position="0 0 0" rotation="0 0 0" width="1.8" height="1.2" color="#000000" opacity="0.8"></a-plane>
        
        <!-- Titolo -->
        <a-text value="Bitter Effects" 
                color="#FF5555" 
                position="-0.8 0.45 0.01" 
                width="3" 
                scale="0.6 0.6 0.6">
        </a-text>

        <!-- Testo principale tradotto -->
        <a-text value="Extensive sugarcane crops are a prime\nexample of this poisoning. Ripeners and\nother chemicals drift, contaminating\neverything in their path and rendering\nthe land useless. Family subsistence\ncrops are not out of danger either." 
                color="#FFFFFF" 
                position="-0.8 0.15 0.01" 
                width="2.8" 
                scale="0.35 0.35 0.35">
        </a-text>
      </a-entity>
    </a-scene>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker attivo:', reg.scope))
            .catch(err => console.log('Service Worker fallito:', err));
        });
      }
    </script>
  </body>
</html>
